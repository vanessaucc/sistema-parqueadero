spring.application.name=parqueadero-springboot-app

# ---------------------------------------------------------------
# PostgreSQL (se pueden sobreescribir con variables de entorno)
#   DB_URL, DB_USERNAME, DB_PASSWORD
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/parqueadero_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Margarita162431?}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea/actualiza las tablas automáticamente al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Capacidad del Parqueadero
parqueadero.capacidad.automoviles=50
parqueadero.capacidad.motocicletas=30


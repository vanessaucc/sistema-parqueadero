# PostgreSQL listo para usar con la configuración por defecto de la app.
#   docker compose up -d      -> levanta la base
#   docker compose down       -> la apaga (los datos se conservan en el volumen)
#   docker compose down -v    -> la apaga y borra los datos
services:
  postgres:
    image: postgres:16
    container_name: parqueadero-postgres
    environment:
      POSTGRES_DB: parqueadero_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - parqueadero_pgdata:/var/lib/postgresql/data

volumes:
  parqueadero_pgdata:
